name: Run Tests on Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore dependencies
        run: dotnet restore SauceDemo_Tests.csproj

      - name: Build
        run: dotnet build --no-restore SauceDemo_Tests.csproj

      - name: Run tests
        run: dotnet test --no-build --verbosity normal SauceDemo_Tests.csproj

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/
