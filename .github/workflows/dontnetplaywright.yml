name: Run Tests on Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore Dependencies
        run: dotnet restore SauceDemo_Tests.csproj

      - name: Build Project
        run: dotnet build SauceDemo_Tests.csproj --no-restore

      - name: Install Playwright CLI + Browsers
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install

      - name: Run Tests
        run: dotnet test SauceDemo_Tests.csproj --no-build --verbosity normal

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore Dependencies
        run: dotnet restore SauceDemo_Tests.csproj

      - name: Build Project
        run: dotnet build SauceDemo_Tests.csproj --no-restore

      - name: Install Playwright Browsers
        run: pwsh bin/Debug/net7.0/playwright.ps1 install

      - name: Run Tests
        run: dotnet test SauceDemo_Tests.csproj --no-build --verbosity normal

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/
